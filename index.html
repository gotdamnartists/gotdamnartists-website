<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gotdamnartists</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border-radius: 0 !important;
        }

        body, html {
            width: 100%;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Space Mono', monospace;
            overflow: hidden;
            position: relative;
        }

        /* Die sich ständig bewegende Raupe quer über den Bildschirm */
        .caterpillar {
            position: fixed;
            top: 45vh;
            font-size: 3rem;
            cursor: pointer;
            z-index: 100;
            user-select: none;
            animation: crawlAndWiggle 10s linear infinite;
            filter: drop-shadow(0 0 12px rgba(255,255,255,0.25));
            transition: transform 0.15s ease;
        }

        .caterpillar:hover {
            transform: scale(1.4);
        }

        @keyframes crawlAndWiggle {
            0% {
                left: -160px;
                transform: translateY(0) rotate(0deg);
            }
            20% {
                transform: translateY(-30px) rotate(-8deg);
            }
            40% {
                transform: translateY(20px) rotate(8deg);
            }
            60% {
                transform: translateY(-25px) rotate(-5deg);
            }
            80% {
                transform: translateY(15px) rotate(5deg);
            }
            100% {
                left: 105vw;
                transform: translateY(0) rotate(0deg);
            }
        }

        /* Message Box / Fight Club Call */
        .message-box {
            position: absolute;
            background: #000000;
            border: 3px solid #ffffff;
            padding: 1.8rem 2.4rem;
            font-family: 'Archivo Black', sans-serif;
            font-size: 1.25rem;
            text-transform: uppercase;
            z-index: 200;
            display: none;
            box-shadow: 0 15px 40px rgba(255,255,255,0.15);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            max-width: 90vw;
            text-align: center;
        }

        @keyframes popIn {
            0% { transform: scale(0.4); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .clickable-heart {
            font-size: 2.8rem;
            cursor: pointer;
            display: inline-block;
            margin-top: 1rem;
            transition: transform 0.2s ease;
        }

        .clickable-heart:hover {
            transform: scale(1.35);
        }

        /* Finale Liebeserklärung */
        .final-message {
            position: absolute;
            font-family: 'Archivo Black', sans-serif;
            font-size: clamp(2rem, 5vw, 4.5rem);
            text-transform: uppercase;
            z-index: 300;
            display: none;
            text-align: center;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            letter-spacing: -0.03em;
            max-width: 90vw;
            padding: 1rem;
        }
    </style>
</head>
<body>

    <!-- Die schlängelnde Raupe -->
    <div class="caterpillar" id="caterpillar" title="Fang mich!">🐛🐛🐛</div>

    <!-- Fight Club Box -->
    <div class="message-box" id="box1">
        Fight Club-Call nicht vergessen!<br>
        <span class="clickable-heart" id="heart1">❤️</span>
    </div>

    <!-- Finale Nachricht -->
    <div class="final-message" id="finalMsg">
        Love you ❤️❤️❤️
    </div>

    <script>
        const caterpillar = document.getElementById('caterpillar');
        const box1 = document.getElementById('box1');
        const heart1 = document.getElementById('heart1');
        const finalMsg = document.getElementById('finalMsg');

        // Hilfsfunktion für zufällige Positionen (kreuz und quer auf dem Bildschirm)
        function getRandomPosition(elementWidth = 300, elementHeight = 150) {
            const maxX = window.innerWidth - elementWidth - 50;
            const maxY = window.innerHeight - elementHeight - 50;
            const randomX = Math.max(20, Math.floor(Math.random() * maxX));
            const randomY = Math.max(20, Math.floor(Math.random() * maxY));
            return { x: randomX, y: randomY };
        }

        // Klick auf die Raupe
        caterpillar.addEventListener('click', function(e) {
            e.stopPropagation();
            caterpillar.style.display = 'none';

            const pos = getRandomPosition(320, 160);
            box1.style.left = pos.x + 'px';
            box1.style.top = pos.y + 'px';
            box1.style.display = 'block';
        });

        // Klick auf das Herz
        heart1.addEventListener('click', function(e) {
            e.stopPropagation();
            box1.style.display = 'none';

            const pos2 = getRandomPosition(400, 150);
            finalMsg.style.left = pos2.x + 'px';
            finalMsg.style.top = pos2.y + 'px';
            finalMsg.style.display = 'block';
        });
    </script>

</body>
</html>
