<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gotdamnartists</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Sugra / Brutalismus Geo-Schriftart -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --text-silver: #a6a6a6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border-radius: 0 !important;
        }

        body, html {
            width: 100%;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Archivo Black', sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding-left: 8vw;
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }

        h1 {
            font-size: clamp(2.5rem, 6.5vw, 6rem);
            line-height: 1.05;
            text-transform: uppercase;
            letter-spacing: -0.04em;
            color: var(--text-color);
        }

        /* "artists" Link */
        span.artists-link {
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 10px;
            text-decoration-thickness: 4px;
            transition: color 0.3s ease;
        }

        /* Süße Ameisenstraße Animation */
        .ant-parade {
            position: fixed;
            top: 50%;
            left: -300px;
            transform: translateY(-50%);
            font-size: 3.5rem;
            white-space: nowrap;
            z-index: 999;
            pointer-events: none;
            display: none;
            letter-spacing: 1.5rem;
        }

        @keyframes marchAcross {
            0% {
                left: -300px;
            }
            100% {
                left: 105vw;
            }
        }

        .ant-parade.animate {
            display: block;
            animation: marchAcross 2.2s linear forwards;
        }
    </style>
</head>
<body>

    <!-- Ameisenstraße die quer durch den Bildschirm läuft -->
    <div class="ant-parade" id="antParade">🐜 🐜 🐜 🐜 🐜 🐜 🐜</div>

    <!-- Hero / Startpage Content -->
    <div class="hero-content">
        <h1>
            this isnt for ants, <br>
            this is for <span class="artists-link" id="artist-trigger">artists</span>
        </h1>
    </div>

    <script>
        document.getElementById('artist-trigger').addEventListener('click', function() {
            // Wort wird silber
            this.style.color = 'var(--text-silver)';
            
            // Ameisen laufen los
            const parade = document.getElementById('antParade');
            parade.classList.add('animate');

            // Nach der Animation Ameisen zurücksetzen
            setTimeout(function() {
                parade.classList.remove('animate');
            }, 2300);
        });
    </script>

</body>
</html>
