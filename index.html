<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gotdamnartists</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100vh;
            background-color: #080808;
            color: #f4f4f4;
            font-family: 'Space Mono', monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .hero {
            text-align: center;
            padding: 2rem;
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: clamp(2rem, 5vw, 5rem);
            line-height: 1.1;
            text-transform: lowercase;
            letter-spacing: -0.03em;
            color: #ffffff;
        }

        h1 span {
            cursor: pointer;
            transition: color 0.2s ease;
        }

        h1 span:hover {
            color: #ff2200;
        }
    </style>
</head>
<body>

    <section class="hero">
        <h1>
            this isnt for ants,<br>
            this is for <span id="artist-trigger">artists</span>
        </h1>
    </section>

    <script>
        document.getElementById('artist-trigger').addEventListener('click', function() {
            alert('Hier geht es bald zu den Künstlern!');
        });
    </script>

</body>
</html>
