<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gotdamnartists</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --text-silver: #a6a6a6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border-radius: 0 !important;
        }

        body, html {
            width: 100%;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Space Mono', monospace;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Die sich ständig bewegende Raupe quer über den Bildschirm */
        .caterpillar {
            position: fixed;
            top: 50%;
            font-size: 3rem;
            cursor: pointer;
            z-index: 100;
            user-select: none;
            animation: crawlAndWiggle 12s linear infinite;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));
            transition: transform 0.1s;
        }

        .caterpillar:hover {
            transform: scale(1.3);
        }

        @keyframes crawlAndWiggle {
            0% {
                left: -150px;
                transform: translateY(-50%) rotate(0deg);
            }
            25% {
                transform: translateY(-70%) rotate(-10deg);
            }
            50% {
                transform: translateY(-30%) rotate(10deg);
            }
            75% {
                transform: translateY(-60%) rotate(-5deg);
            }
            100% {
                left: 105vw;
                transform: translateY(-50%) rotate(0deg);
            }
        }

        /* Popups / Textboxen kreuz und quer auf dem Bildschirm */
        .message-box {
            position: fixed;
            background: #000000;
            border: 2px solid #ffffff;
            padding: 1.5rem 2rem;
            font-family: 'Archivo Black', sans-serif;
            font-size: 1.2rem;
            text-transform: uppercase;
            z-index: 200;
            display: none;
            box-shadow: 0 10px 30px rgba(255,255,255,0.1);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .clickable-heart {
            font-size: 2.5rem;
            cursor: pointer;
            display: inline-block;
            margin-top: 1rem;
            transition: transform 0.2s;
        }

        .clickable-heart:hover {
            transform: scale(1.3);
        }

        .final-message {
            position: fixed;
            font-family: 'Archivo Black', sans-serif;
            font-size: clamp(2rem, 5vw, 4rem);
            text-transform: uppercase;
            z-index: 300;
            display: none;
            text-align: center;
            animation: popIn 0.4s ease forwards;
            letter-spacing: -0.02em;
        }
    </style>
</head>
<body>

    <!-- Die sich bewegende Raupe -->
    <div class="caterpillar" id="caterpillar" title="Fangk mich!">🐛🐛🐛</div>

    <!-- Erste Nachricht nach Klick auf Raupe -->
    <div class="message-box" id="box1" style="top: 25%; left: 15%;">
        Fight Club-Call nicht vergessen!<br>
        <span class="clickable-heart" id="heart1">❤️</span>
    </div>

    <!-- Finale Liebeserklärung (wird kreuz und quer platziert) -->
    <div class="final-message" id="finalMsg">
        Love you ❤️❤️❤️
    </div>

    <script>
        const caterpillar = document.getElementById('caterpillar');
        const box1 = document.getElementById('box1');
        const heart1 = document.getElementById('heart1');
        const finalMsg = document.getElementById('finalMsg');

        // Wenn man die Raupe anklickt
        caterpillar.addEventListener('click', function(e) {
            e.stopPropagation();
            // Raupe verschwindet
            caterpillar.style.display = 'none';
            
            // Erste Box erscheint zufällig kreuz und quer auf dem Bildschirm
            const randomTop = Math.floor(Math.random() * 60) + 15; // Zwischen 15% und 75%
            const randomLeft = Math.floor(Math.random() * 60) + 10; // Zwischen 10% und 70%
            box1.style.top = randomTop + '%';
            box1.style.left = randomLeft + '%';
            box1.style.display = 'block';
        });

        // Wenn man auf das erste Herz klickt
        heart1.addEventListener('click', function(e) {
            e.stopPropagation();
            // Erste Box ausblenden
            box1.style.display = 'none';

            // Finale Nachricht erscheint auch an einer zufälligen, kreuz und queren Position
            const randomTop2 = Math.floor(Math.random() * 60) + 20;
            const randomLeft2 = Math.floor(Math.random() * 50) + 20;
            finalMsg.style.top = randomTop2 + '%';
            finalMsg.style.left = randomLeft2 + '%';
            finalMsg.style.display = 'block';
        });
    </script>

</body>
</html>
